name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: >
          dotnet publish SkyScope.UI/SkyScope.UI.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:EnableCompressionInSingleFile=true
          -o Skyscope

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("Skyscope\SkyScope.exe")
          "tag=$($info.FileVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Tag release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path Skyscope -DestinationPath SkyScope-${{ steps.version.outputs.tag }}.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SkyScope ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: SkyScope-${{ steps.version.outputs.tag }}.zip

      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_GROUP_ID }}
          filename: SkyScope-${{ steps.version.outputs.tag }}.zip
          version: ${{ steps.version.outputs.tag }}
          display_name: SkyScope ${{ steps.version.outputs.tag }}
          category: main
          archive_existing_version: true
          allow_mod_manager_download: false
