name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish SkyScope.UI/SkyScope.UI.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Generate version tag
        id: version
        shell: pwsh
        run: |
          $prefix = Get-Date -Format 'yyyyMM'
          git fetch --tags
          $count = @(git tag -l | Where-Object { $_ -match '^\d{6}\.\d+$' }).Count
          $next  = $count + 1
          "tag=$prefix.$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Tag release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath SkyScope-${{ steps.version.outputs.tag }}.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SkyScope ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: SkyScope-${{ steps.version.outputs.tag }}.zip

      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.5
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_group_id: ${{ secrets.NEXUS_GROUP_ID }}
          filename: SkyScope-${{ steps.version.outputs.tag }}.zip
          version: ${{ steps.version.outputs.tag }}
          display_name: SkyScope ${{ steps.version.outputs.tag }}
          file_category: main
          archive_existing_file: true
          allow_mod_manager_download: false
